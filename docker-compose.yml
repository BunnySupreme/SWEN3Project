services:
  paperless-postgres:
    image: postgres:17.5
    container_name: paperless-postgres
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-geminisummarizer:
    build:
      context: ./paperless/src/Paperless.GeminiSummarizer
      dockerfile: Dockerfile
    container_name: paperless-geminisummarizer
    ports:
      - "8090:8090"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-rabbitmq:
    image: rabbitmq:4.2.0-management
    container_name: paperless-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=paperless
    ports:
      - "5672:5672" # RabbitMQ main port (AMQP protocol)
      - "15672:15672" # Management console
    volumes:
      - ./config/myrabbitmq.conf:/etc/rabbitmq/rabbitmq.conf # Custom configuration file, .conf for new style format
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: paperless-minio
    environment:
      - MINIO_ROOT_USER=paperless
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password
    ports:
      - "9000:9000" # Management console
      - "9001:9001" # Data
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    secrets:
      - minio_password
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-adminer:
    image: adminer:5.4.1
    container_name: paperless-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=paperless-postgres
    ports:
      - "8080:8080"
    depends_on:
      - paperless-postgres
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-elastic:
    image: elasticsearch:9.2.2
    container_name: paperless-elastic
    ports:
      - "9200:9200"
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-kibana:
    image: kibana:9.2.2
    container_name: paperless-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_URL=http://localhost:9200
    depends_on:
      - paperless-elastic
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-backend:
    build:
      context: ./paperless/src/paperless
      dockerfile: Dockerfile
    container_name: paperless-backend
    volumes:
      - ./logs:/app/logs
      - xml_data:/app/xml_data
    ports:
      - "5001:5001"
      - "7081:7081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001 # http://+:7081 would require certificate for docker container
      - POSTGRES_HOST=paperless-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=paperless
      - POSTGRES_USERNAME=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_INPUTQUEUE=${RABBITMQ_INPUTQUEUE}
      - RABBITMQ_RESULTSQUEUE=${RABBITMQ_RESULTSQUEUE}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password
      - ACCESSLOG_INPUTDIR=/app/xml_data/input
    depends_on:
      - paperless-postgres
      - paperless-rabbitmq
      - paperless-minio
      - paperless-elastic
    secrets:
      - postgres_password
      - minio_password
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-ocrworker:
    build:
      context: ./paperless/src/Paperless.OcrWorker
      dockerfile: Dockerfile
    container_name: paperless-ocrworker
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_INPUTQUEUE=${RABBITMQ_INPUTQUEUE}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password
      - GEMINI_BASE_URL=http://paperless-geminisummarizer:8090
    depends_on:
      - paperless-rabbitmq
      - paperless-minio
      - paperless-geminisummarizer
      - paperless-elastic
    secrets:
      - minio_password
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-batchProcessor:
    build:
      context: ./paperless/src/Paperless.batchProcessor
      dockerfile: Dockerfile
    container_name: paperless-batchProcessor
    volumes:
      - xml_data:/app/xml_data
    environment:
      - POSTGRES_HOST=paperless-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=paperless
      - POSTGRES_USERNAME=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - ACCESSLOG_INPUTDIR=/app/xml_data/input
      - ACCESSLOG_ARCHIVEDIR=/app/xml_data/archive
      - ACCESSLOG_ERRORDIR=/app/xml_data/error
    depends_on:
      - paperless-postgres
      - paperless-backend
    secrets:
      - postgres_password
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paperless-frontend
    ports:
      - "80:80"
    depends_on:
      - paperless-backend
    networks:
      - paperless-network
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  rabbit_password:
    file: ./secrets/rabbit_password.txt
  minio_password:
    file: ./secrets/minio_password.txt

networks:
  paperless-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  elastic_data:
  xml_data: