services:
  # Database
  paperless-postgres:
    image: postgres:17.5
    container_name: paperless-postgres
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - paperless-network
    restart: unless-stopped

  # .NET Services
  paperless-backend:
    build:
      context: ./paperless/src/paperless
      dockerfile: Dockerfile
    container_name: paperless-backend
    volumes:
      - ./logs:/app/logs
    ports:
      - "5001:5001"
      - "7081:7081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001 # http://+:7081 would require certificate for docker container
      - POSTGRES_HOST=paperless-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=paperless
      - POSTGRES_USERNAME=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    depends_on:
      - paperless-postgres
    secrets:
      - postgres_password
    networks:
      - paperless-network
    restart: unless-stopped

  paperless-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paperless-frontend
    ports:
      - "80:80"
    depends_on:
      - paperless-backend
    networks:
      - paperless-network
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  rabbit_password:
    file: ./secrets/rabbit_password.txt
  minio_password:
    file: ./secrets/minio_password.txt

networks:
  paperless-network:
    driver: bridge

volumes:
  postgres_data: